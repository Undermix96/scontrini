name: scontrini
description: "Fotografa gli scontrini, estrai righe e categorie con l'AI e tieni traccia delle spese."
publish_to: 'none'
# In CI nome e numero di build vengono sovrascritti: nome = data (CalVer,
# es. 2026.11.5), build = numero dell'esecuzione del workflow. Vedi
# .github/workflows/build.yml. Questo valore vale solo per le build locali.
version: 0.1.0+1

environment:
  sdk: ^3.5.0

# Solo dipendenze open source, senza SDK di analytics, crash reporting o Google Play Services.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  image_picker: ^1.1.2
  flutter_secure_storage: ^11.2.0
  intl: ^0.20.2
  url_launcher: ^6.3.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  # Manrope (SIL Open Font License 1.1, vedi assets/fonts/OFL.txt), incluso
  # nell'app: nessun font scaricato a runtime.
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800

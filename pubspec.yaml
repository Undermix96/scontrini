name: scontrini
description: "Fotografa gli scontrini, estrai righe e categorie con l'AI e tieni traccia delle spese."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

# Solo dipendenze open source, senza SDK di analytics, crash reporting o Google Play Services.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  image_picker: ^1.1.2
  flutter_secure_storage: ^9.2.2
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

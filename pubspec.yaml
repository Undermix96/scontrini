name: scontrini
description: "Fotografa gli scontrini, estrai righe e categorie con l'AI e tieni traccia delle spese."
publish_to: 'none'
# In CI nome e numero di build vengono sovrascritti: nome = data (CalVer,
# es. 2026.11.5), build = numero dell'esecuzione del workflow. Vedi
# .github/workflows/build.yml. Questo valore vale solo per le build locali.
version: 0.1.0+1

environment:
  sdk: ^3.5.0

# Solo dipendenze open source, senza SDK di analytics, crash reporting o Google Play Services.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  image_picker: ^1.1.2
  flutter_secure_storage: ^11.2.0
  intl: ^0.20.2
  url_launcher: ^6.3.3
  drift: ^2.35.3
  path_provider: ^2.1.6
  file_picker: ^13.3.2
  pdf: ^3.13.1
  drift_sqflite: ^2.0.1
  local_auth: ^3.0.2
  crypto: ^3.0.8
  local_auth_android: ^2.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  drift_dev: ^2.35.2
  build_runner: ^2.17.1
  sqlite3: 3.5.2

flutter:
  uses-material-design: true
  # Manrope (SIL Open Font License 1.1, vedi assets/fonts/OFL.txt), incluso
  # nell'app: nessun font scaricato a runtime.
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800

# L'app usa il SQLite del sistema tramite sqflite (drift_sqflite), senza FFI.
# package:sqlite3 (dipendenza di drift) serve solo ai test: per non includere
# nell'APK una libreria SQLite precompilata scaricata, la si cerca nel sistema.
# Test su Windows: winsqlite3.dll; su Linux (CI): libsqlite3.so.0 di Ubuntu.
hooks:
  user_defines:
    sqlite3:
      source: system
      name_windows: winsqlite3
      name_linux: /usr/lib/x86_64-linux-gnu/libsqlite3.so.0

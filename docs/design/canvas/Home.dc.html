<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Movimenti</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; padding-top: 56px; background: {{t.bg}}; color: {{t.tx}}; font-family: Manrope, system-ui, sans-serif; overflow: hidden">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 0 20px 16px">
    <div style="display: flex; align-items: center; gap: 4px">
      <button type="button" aria-label="Mese precedente" style="width: 44px; height: 44px; border: 0; border-radius: 50%; background: {{t.sf}}; color: {{t.tx}}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
      <h1 style="margin: 0 8px; font-size: 18px; font-weight: 800">Novembre 2026</h1>
      <button type="button" aria-label="Mese successivo" style="width: 44px; height: 44px; border: 0; border-radius: 50%; background: {{t.sf}}; color: {{t.mu}}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
    <button type="button" aria-label="Cerca" style="width: 44px; height: 44px; border: 0; border-radius: 50%; background: {{t.sf}}; color: {{t.tx}}; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/></svg></button>
  </header>

  <section style="margin: 0 20px">
    <div style="padding: 20px 20px 22px; border-radius: 28px 28px 0 0; background: {{t.hero}}; color: #14112B; display: flex; flex-direction: column; gap: 18px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 14px; font-weight: 600; color: #3A3370">Speso a novembre</span>
        <span style="font-size: 42px; font-weight: 800; letter-spacing: -1.2px; line-height: 1.05; font-variant-numeric: tabular-nums">€ 482,30</span>
        <span style="font-size: 13px; font-weight: 600; color: #3A3370">14 scontrini · 2 da controllare</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <button type="button" style="height: 52px; border: 0; border-radius: 999px; background: #14112B; color: #FFFFFF; font: 700 15px Manrope, system-ui, sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Fotografa</button>
        <button type="button" style="height: 52px; border: 0; border-radius: 999px; background: rgba(255,255,255,0.55); color: #14112B; font: 700 15px Manrope, system-ui, sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9.5" r="1.5"/><path d="M20 15l-4.5-4.5L6 20"/></svg>Galleria</button>
      </div>
    </div>
    <svg width="350" height="9" viewBox="0 0 350 9" aria-hidden="true" style="display: block"><path d="{{zig}}" fill="{{t.hero}}"/></svg>
  </section>

  <section style="padding: 20px 20px 0; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <h2 style="margin: 0; font-size: 18px; font-weight: 800">Movimenti</h2>
      <a href="#" style="font-size: 14px; font-weight: 700; color: {{t.ac}}; text-decoration: none; padding: 10px 0">Filtra</a>
    </div>
    <sc-for list="{{days}}" as="d" hint-placeholder-count="2">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 13px; font-weight: 700; color: {{t.mu}}; padding: 6px 0">{{d.label}}</span>
        <div style="border-radius: 20px; background: {{t.sf}}; padding: 4px 0">
          <sc-for list="{{d.items}}" as="r" hint-placeholder-count="2">
            <a href="Receipt.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 10px 14px; color: inherit; text-decoration: none">
              <span style="position: relative; width: 44px; height: 44px; border-radius: 14px; background: {{t.sf2}}; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800; flex-shrink: 0">{{r.ini}}<span style="position: absolute; right: -2px; bottom: -2px; width: 14px; height: 14px; border-radius: 50%; background: {{r.cat}}; border: 2.5px solid {{t.sf}}"></span></span>
              <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
                <span style="font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</span>
                <sc-if value="{{r.flag}}" hint-placeholder-val="{{ false }}">
                  <span style="align-self: flex-start; display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; background: {{t.warnBg}}; color: {{t.warnTx}}; font-size: 12px; font-weight: 700"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17h.01"/></svg>{{r.flag}}</span>
                </sc-if>
                <sc-if value="{{r.noflag}}" hint-placeholder-val="{{ true }}">
                  <span style="font-size: 13px; color: {{t.mu}}">{{r.sub}}</span>
                </sc-if>
              </span>
              <span style="font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums">{{r.amt}}</span>
            </a>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </section>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 130px; background: linear-gradient(to bottom, {{t.fade}}, {{t.bg}} 55%)"></div>
  <nav aria-label="Principale" style="position: absolute; left: 20px; right: 20px; bottom: 28px; display: flex; align-items: center; gap: 10px">
    <div style="flex: 1; display: flex; align-items: center; gap: 4px; padding: 6px; border-radius: 999px; background: {{t.nav}}; border: 1px solid {{t.navBd}}">
      <a href="Home.dc.html" aria-current="page" style="flex: 1.6; height: 48px; border-radius: 999px; background: {{t.cta}}; color: {{t.ctaInk}}; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; font-size: 14px; font-weight: 800"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{t.acNav}}" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h9"/></svg>Movimenti</a>
      <a href="Stats.dc.html" aria-label="Spese" style="flex: 1; height: 48px; border-radius: 999px; color: {{t.mu}}; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg></a>
      <a href="Categories.dc.html" aria-label="Categorie" style="flex: 1; height: 48px; border-radius: 999px; color: {{t.mu}}; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.5"/></svg></a>
      <a href="Setup.dc.html" aria-label="Impostazioni" style="flex: 1; height: 48px; border-radius: 999px; color: {{t.mu}}; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></a>
    </div>
    <a href="Scan.dc.html" aria-label="Fotografa uno scontrino" style="width: 62px; height: 62px; border-radius: 50%; background: {{t.hero}}; color: #14112B; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const P = {
      dark: { bg: '#0C0C10', fade: 'rgba(12,12,16,0)', sf: '#17171D', sf2: '#22222A', tx: '#F4F3F8', mu: '#A3A1B3', ac: '#A99CFF', hero: '#A598FF', warnBg: '#3A2C12', warnTx: '#FFD99A', cta: '#F4F3F8', ctaInk: '#0C0C10', acNav: '#5B4BDB', nav: '#22222A', navBd: '#33333E' },
      light: { bg: '#F4F3F8', fade: 'rgba(244,243,248,0)', sf: '#FFFFFF', sf2: '#ECEAF4', tx: '#14131A', mu: '#5E5B6E', ac: '#5B4BDB', hero: '#B4A9FF', warnBg: '#FFF1DA', warnTx: '#6B4000', cta: '#14131A', ctaInk: '#FFFFFF', acNav: '#B4A9FF', nav: '#FFFFFF', navBd: '#E0DEEA' }
    };
    let zig = 'M0 0H350V0';
    for (let x = 350; x > 0; x -= 10) zig += 'L' + (x - 5) + ' 8L' + (x - 10) + ' 0';
    zig += 'Z';
    const r = (ini, name, sub, amt, cat, flag) => ({ ini, name, sub, amt, cat, flag: flag || '', noflag: !flag });
    return {
      t: P[this.props.theme === 'light' ? 'light' : 'dark'],
      zig,
      days: [
        { label: 'Oggi · giovedì 5', items: [
          r('E', 'Esselunga', '18 righe · Alimentari', '€ 64,20', '#4CC38A', 'Totale da verificare'),
          r('F', 'Farmacia Comunale', '2 righe · Salute', '€ 18,90', '#F26D6D')
        ] },
        { label: 'Mercoledì 4', items: [
          r('C', 'Coop', '9 righe · Alimentari', '€ 37,85', '#4CC38A', 'Possibile doppione'),
          r('B', 'Bar Centrale', '2 righe · Bevande', '€ 4,30', '#F0A35A')
        ] }
      ]
    };
  }
}
</script>
</body>
</html>

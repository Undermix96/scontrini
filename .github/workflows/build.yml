name: Build app

# Le build partono SOLO manualmente (Actions → "Build app" → Run workflow).
# Per attivarle automaticamente a ogni push, aggiungi un trigger `push:`.
on:
  workflow_dispatch:
    inputs:
      android:
        description: "Build Android (APK)"
        type: boolean
        default: true
      ios:
        description: "Build iOS (IPA non firmato)"
        type: boolean
        default: true
      release:
        description: "Pubblica una release GitHub con APK/IPA e changelog"
        type: boolean
        default: true
      note:
        description: "Nota facoltativa in cima al changelog della release"
        type: string
        required: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  # Versione CalVer: nome = data della build (fuso Europe/Rome, es. 2026.11.5),
  # numero di build = numero dell'esecuzione del workflow (sempre crescente,
  # distingue più build nello stesso giorno). Calcolata una volta per tutti i job.
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      name: ${{ steps.v.outputs.name }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - id: v
        run: |
          read -r y m d <<< "$(TZ=Europe/Rome date '+%Y %m %d')"
          name="$y.$((10#$m)).$((10#$d))"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "build=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "Versione $name (build ${{ github.run_number }})"

  android:
    if: ${{ inputs.android }}
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Disabilita analytics Flutter/Dart
        run: |
          flutter config --no-analytics
          dart --disable-analytics

      - run: flutter pub get

      - run: flutter analyze --no-fatal-infos

      # I test usano il SQLite di sistema via FFI (vedi `hooks` in pubspec.yaml).
      - name: SQLite per i test
        run: test -f /usr/lib/x86_64-linux-gnu/libsqlite3.so.0 || sudo apt-get install -y libsqlite3-0

      - run: flutter test

      # Firma release con i secrets del repo (configurati). Senza secrets (es. in un
      # fork) l'APK è firmato con la chiave di debug e compare un avviso.
      - name: Prepara keystore di firma
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.jks
            cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
            echo "Firma release configurata"
          else
            echo "::warning::Secrets di firma assenti: APK firmato con chiave di debug"
          fi

      - name: Build APK
        env:
          APP_VERSION: ${{ needs.version.outputs.name }}
          APP_BUILD: ${{ needs.version.outputs.build }}
        run: >-
          flutter build apk --release --split-per-abi
          --build-name="$APP_VERSION" --build-number="$APP_BUILD"
          --dart-define=APP_VERSION="$APP_VERSION" --dart-define=APP_BUILD="$APP_BUILD"

      - name: Rimuovi keystore
        if: always()
        run: rm -f android/app/release.jks android/key.properties

      - uses: actions/upload-artifact@v5
        with:
          name: scontrini-android-${{ needs.version.outputs.name }}-b${{ needs.version.outputs.build }}
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

  ios:
    if: ${{ inputs.ios }}
    needs: version
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Disabilita analytics Flutter/Dart
        run: |
          flutter config --no-analytics
          dart --disable-analytics

      - run: flutter pub get

      - name: Build iOS (senza firma)
        env:
          APP_VERSION: ${{ needs.version.outputs.name }}
          APP_BUILD: ${{ needs.version.outputs.build }}
        run: >-
          flutter build ios --release --no-codesign
          --build-name="$APP_VERSION" --build-number="$APP_BUILD"
          --dart-define=APP_VERSION="$APP_VERSION" --dart-define=APP_BUILD="$APP_BUILD"

      - name: Crea IPA non firmato
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr scontrini-unsigned.ipa Payload

      - uses: actions/upload-artifact@v5
        with:
          name: scontrini-ios-unsigned-${{ needs.version.outputs.name }}-b${{ needs.version.outputs.build }}
          path: scontrini-unsigned.ipa
          retention-days: 30



  # Release GitHub con i pacchetti installabili (APK per ABI, IPA non firmato) e
  # il changelog: i commit dall'ultima release (tag v*) a questo. Parte se almeno
  # una piattaforma è stata compilata e nessuna è fallita.
  release:
    needs: [version, android, ios]
    if: >-
      ${{ always() && inputs.release
      && needs.version.result == 'success'
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
      && (needs.android.result == 'success' || needs.ios.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # serve la storia completa e i tag per il changelog

      - uses: actions/download-artifact@v5
        with:
          pattern: scontrini-*-${{ needs.version.outputs.name }}-b${{ needs.version.outputs.build }}
          path: artifacts
          merge-multiple: true

      - name: Rinomina i pacchetti e calcola i checksum
        env:
          APP_VERSION: ${{ needs.version.outputs.name }}
        run: |
          mkdir dist
          # app-arm64-v8a-release.apk → scontrini-2026.11.7-arm64-v8a.apk
          for f in artifacts/*.apk; do
            [ -e "$f" ] || continue
            abi=$(basename "$f" .apk | sed -e 's/^app-//' -e 's/-release$//')
            cp "$f" "dist/scontrini-$APP_VERSION-$abi.apk"
          done
          if [ -e artifacts/scontrini-unsigned.ipa ]; then
            cp artifacts/scontrini-unsigned.ipa "dist/scontrini-$APP_VERSION-ios-unsigned.ipa"
          fi
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -l dist && cat dist/SHA256SUMS.txt

      - name: Scrivi il changelog
        env:
          APP_VERSION: ${{ needs.version.outputs.name }}
          APP_BUILD: ${{ needs.version.outputs.build }}
          NOTE: ${{ inputs.note }}
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null || true)
          {
            if [ -n "$NOTE" ]; then printf '%s\n\n' "$NOTE"; fi
            echo "## Novità"
            echo
            if [ -n "$prev" ]; then
              changes=$(git log --no-merges --format='- %s' "$prev..HEAD")
            else
              changes=$(git log --no-merges --format='- %s' HEAD)
            fi
            echo "${changes:-- Nessuna modifica al codice rispetto a $prev}"
            echo
            echo "## Installazione"
            echo
            echo "**Android**: scarica l'APK per il tuo telefono. Quasi tutti i telefoni recenti usano \`arm64-v8a\`; \`armeabi-v7a\` è per i telefoni a 32 bit, \`x86_64\` per emulatori e Chromebook."
            echo
            echo "**iOS**: l'IPA non è firmato; va firmato e installato con uno strumento di sideload (AltStore, Sideloadly…)."
            echo
            echo "Versione \`$APP_VERSION\` (build $APP_BUILD), commit ${GITHUB_SHA:0:7}. Checksum in \`SHA256SUMS.txt\`."
            if [ -n "$prev" ]; then
              echo
              echo "Confronto completo: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$prev...v$APP_VERSION-b$APP_BUILD"
            fi
          } > release-notes.md
          cat release-notes.md

      - name: Crea la release
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ needs.version.outputs.name }}
          APP_BUILD: ${{ needs.version.outputs.build }}
        run: |
          gh release create "v$APP_VERSION-b$APP_BUILD" dist/* \
            --target "$GITHUB_SHA" \
            --title "Scontrini $APP_VERSION (build $APP_BUILD)" \
            --notes-file release-notes.md

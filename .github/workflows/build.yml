name: Build app

# Le build partono SOLO manualmente (Actions → "Build app" → Run workflow).
# Per attivarle automaticamente a ogni push, aggiungi un trigger `push:`.
on:
  workflow_dispatch:
    inputs:
      android:
        description: "Build Android (APK)"
        type: boolean
        default: true
      ios:
        description: "Build iOS (IPA non firmato)"
        type: boolean
        default: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  # Versione CalVer: nome = data della build (fuso Europe/Rome, es. 2026.11.5),
  # numero di build = numero dell'esecuzione del workflow (sempre crescente,
  # distingue più build nello stesso giorno). Calcolata una volta per tutti i job.
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      name: ${{ steps.v.outputs.name }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - id: v
        run: |
          read -r y m d <<< "$(TZ=Europe/Rome date '+%Y %m %d')"
          name="$y.$((10#$m)).$((10#$d))"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "build=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "Versione $name (build ${{ github.run_number }})"

  android:
    if: ${{ inputs.android }}
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Disabilita analytics Flutter/Dart
        run: |
          flutter config --no-analytics
          dart --disable-analytics

      - run: flutter pub get

      - run: flutter analyze --no-fatal-infos

      # I test usano il SQLite di sistema via FFI (vedi `hooks` in pubspec.yaml).
      - name: SQLite per i test
        run: test -f /usr/lib/x86_64-linux-gnu/libsqlite3.so.0 || sudo apt-get install -y libsqlite3-0

      - run: flutter test

      # Firma release con i secrets del repo (configurati). Senza secrets (es. in un
      # fork) l'APK è firmato con la chiave di debug e compare un avviso.
      - name: Prepara keystore di firma
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.jks
            cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
            echo "Firma release configurata"
          else
            echo "::warning::Secrets di firma assenti: APK firmato con chiave di debug"
          fi

      - name: Build APK
        env:
          APP_VERSION: ${{ needs.version.outputs.name }}
          APP_BUILD: ${{ needs.version.outputs.build }}
        run: >-
          flutter build apk --release --split-per-abi
          --build-name="$APP_VERSION" --build-number="$APP_BUILD"
          --dart-define=APP_VERSION="$APP_VERSION" --dart-define=APP_BUILD="$APP_BUILD"

      - name: Rimuovi keystore
        if: always()
        run: rm -f android/app/release.jks android/key.properties

      - uses: actions/upload-artifact@v5
        with:
          name: scontrini-android-${{ needs.version.outputs.name }}-b${{ needs.version.outputs.build }}
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

  ios:
    if: ${{ inputs.ios }}
    needs: version
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Disabilita analytics Flutter/Dart
        run: |
          flutter config --no-analytics
          dart --disable-analytics

      - run: flutter pub get

      - name: Build iOS (senza firma)
        env:
          APP_VERSION: ${{ needs.version.outputs.name }}
          APP_BUILD: ${{ needs.version.outputs.build }}
        run: >-
          flutter build ios --release --no-codesign
          --build-name="$APP_VERSION" --build-number="$APP_BUILD"
          --dart-define=APP_VERSION="$APP_VERSION" --dart-define=APP_BUILD="$APP_BUILD"

      - name: Crea IPA non firmato
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr scontrini-unsigned.ipa Payload

      - uses: actions/upload-artifact@v5
        with:
          name: scontrini-ios-unsigned-${{ needs.version.outputs.name }}-b${{ needs.version.outputs.build }}
          path: scontrini-unsigned.ipa
          retention-days: 30



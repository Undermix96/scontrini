name: Build app

# Le build partono SOLO manualmente (Actions → "Build app" → Run workflow).
# Per attivarle automaticamente a ogni push, aggiungi un trigger `push:`.
on:
  workflow_dispatch:
    inputs:
      android:
        description: "Build Android (APK)"
        type: boolean
        default: true
      ios:
        description: "Build iOS (IPA non firmato)"
        type: boolean
        default: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.9"
  # URL del progetto Supabase (non segreto): Settings → Variables → SUPABASE_URL
  SUPABASE_URL: ${{ vars.SUPABASE_URL }}

jobs:
  android:
    if: ${{ inputs.android }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Disabilita analytics Flutter/Dart
        run: |
          flutter config --no-analytics
          dart --disable-analytics

      - run: flutter pub get

      - run: flutter analyze --no-fatal-infos

      - run: flutter test

      # Firma release opzionale: se i secrets non ci sono, l'APK è firmato con la chiave di debug.
      - name: Prepara keystore di firma
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.jks
            cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
            echo "Firma release configurata"
          else
            echo "::warning::Secrets di firma assenti: APK firmato con chiave di debug"
          fi

      - name: Build APK
        run: flutter build apk --release --split-per-abi --dart-define=SUPABASE_URL="$SUPABASE_URL"

      - name: Rimuovi keystore
        if: always()
        run: rm -f android/app/release.jks android/key.properties

      - uses: actions/upload-artifact@v4
        with:
          name: scontrini-android
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

  ios:
    if: ${{ inputs.ios }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Disabilita analytics Flutter/Dart
        run: |
          flutter config --no-analytics
          dart --disable-analytics

      - run: flutter pub get

      - name: Build iOS (senza firma)
        run: flutter build ios --release --no-codesign --dart-define=SUPABASE_URL="$SUPABASE_URL"

      - name: Crea IPA non firmato
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr scontrini-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: scontrini-ios-unsigned
          path: scontrini-unsigned.ipa
          retention-days: 30

